<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Haikar Keren Mantap Anjay</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    @layer components {
      .field { @apply w-full rounded-lg border border-amber-500/20 bg-black/40 px-3 py-2 text-sm text-amber-50 outline-none transition placeholder:text-amber-100/30 focus:border-amber-400/60 focus:ring-4 focus:ring-amber-400/10; }
      .btn { @apply rounded-lg bg-gradient-to-b from-amber-300 to-amber-500 px-4 py-2 text-sm font-semibold text-stone-900 transition hover:brightness-110 hover:shadow-[0_0_20px_rgba(251,191,36,.45)] active:scale-95; }
      .btn-ghost { @apply rounded-lg border border-amber-500/30 bg-black/30 px-3 py-2 text-sm text-amber-100 transition hover:bg-amber-400/10 hover:border-amber-400/60 active:scale-95; }
      .card { @apply overflow-hidden rounded-2xl border border-amber-500/15 bg-stone-900/70 backdrop-blur transition duration-300 hover:-translate-y-1 hover:border-amber-400/50 hover:shadow-[0_0_32px_rgba(251,191,36,.18)]; border-top: 3px solid var(--accent, rgba(245,158,11,.5)); }
      .fav { @apply grid h-8 w-8 shrink-0 place-items-center rounded-full text-amber-100/30 transition hover:bg-amber-400/10 hover:text-amber-300 active:scale-90; }
      .fav.is-fav { @apply text-amber-400; filter: drop-shadow(0 0 6px rgba(251,191,36,.7)); }
      .fav.is-fav svg { fill: currentColor; }
    }
  </style>
  <style>
    .display { font-family: Cinzel, serif; }
    select option { background: #1a1523; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(circle 320px at var(--mx, 50%) var(--my, 0px), rgba(251,191,36,.09), transparent); }
    .spark { position: absolute; bottom: -10px; width: var(--sz); height: var(--sz); border-radius: 9999px; background: #fcd34d;
      box-shadow: 0 0 8px 2px rgba(252,211,77,.6); opacity: 0; animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 10% { opacity: .8 } 100% { transform: translateY(-105vh) translateX(30px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .spark { display: none } }
  </style>
</head>
<body class="min-h-screen text-amber-50" style="font-family:'EB Garamond',Georgia,serif;font-size:17px;background:radial-gradient(ellipse at top,#241a3a 0%,#0e0b14 55%,#07060a 100%) fixed">
  <div id="sparks" class="pointer-events-none fixed inset-0 z-0 overflow-hidden"></div>

  <header class="sticky top-0 z-20 border-b border-amber-500/20 bg-black/50 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div>
        <h1 class="display bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200 bg-clip-text text-2xl font-bold tracking-wide text-transparent">Harry Potter</h1>
        <p class="display text-[10px] uppercase tracking-[.35em] text-amber-100/40">Hogwart Library</p>
      </div>
      <form id="nameForm" class="flex flex-wrap items-center gap-2">
        <span id="hello" class="display text-sm text-amber-200"></span>
        <input id="name" data-ph="name_ph" maxlength="20" class="field w-36">
        <button data-i18n="save" class="btn"></button>
        <select id="lang" class="field w-auto"></select>
      </form>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-6xl space-y-5 px-4 py-6">
    <nav id="nav" class="display inline-flex flex-wrap gap-1 rounded-xl border border-amber-500/20 bg-black/40 p-1">
      <button data-cat="characters"><span>🧙</span> <span data-i18n="characters"></span></button>
      <button data-cat="spells"><span>🪄</span> <span data-i18n="spells"></span></button>
      <button data-cat="houses"><span>🏰</span> <span data-i18n="houses"></span></button>
      <button data-cat="books"><span>📖</span> <span data-i18n="books"></span></button>
      <button data-cat="favorites"><span>❤️</span> <span data-i18n="favorites"></span></button>
    </nav>

    <section id="controls" class="grid grid-cols-2 gap-2 md:grid-cols-[2fr_1fr_1fr_1fr_auto]">
      <input id="q" data-ph="search" class="field col-span-2 md:col-span-1">
      <select id="f1" class="field"></select>
      <select id="f2" class="field"></select>
      <select id="sort" class="field"></select>
      <button id="dir" class="btn-ghost">↑</button>
    </section>

    <p id="status" class="min-h-5 text-sm text-amber-100/50"></p>
    <div id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    <footer class="display pt-8 text-center text-xs tracking-[.3em] text-amber-100/30">Haikar Keren</footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
